# This workflow checks that the pom can be resolved by Gradle, which is
# stricter than Maven when parsing poms. For instance, Maven tolerates a
# DOCTYPE declaration that makes Gradle fail to parse the pom, breaking
# the dependency resolution of every project using this parent.
name: Check Gradle
on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  check-gradle:
    name: Check Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Install the pom in the local repository
        # gpg.skip is required because install triggers artifact signing
        run: mvn -B install -Dgpg.skip=true
      - name: Get pom version
        id: version
        run: echo "version=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Check Gradle can resolve the pom
        run: |
          mkdir gradle-resolve-test
          cat > gradle-resolve-test/build.gradle.kts <<'EOF'
          plugins { java }
          repositories {
              mavenLocal()
              mavenCentral()
          }
          dependencies {
              implementation("com.fathzer:parent-pom:${{ steps.version.outputs.version }}@pom")
          }
          tasks.register("resolve") {
              val cp = configurations.compileClasspath
              doLast { println(cp.get().files) }
          }
          EOF
          gradle -p gradle-resolve-test resolve
